spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.application.name=zentrip-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SUPABASE_DB_URL:${DB_URL:jdbc:postgresql://db.<YOUR_SUPABASE_PROJECT_REF>.supabase.co:5432/postgres?sslmode=require}}
spring.datasource.username=${SUPABASE_DB_USER:${DB_USERNAME:postgres}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
# Supabase transaction pooling cannot safely reuse session-bound prepared statements.
spring.datasource.hikari.data-source-properties.prepareThreshold=${DB_PREPARE_THRESHOLD:0}
spring.jpa.open-in-view=false
spring.sql.init.mode=${DB_SCHEMA_INIT:never}
spring.sql.init.continue-on-error=false
spring.jackson.serialization.write-dates-as-timestamps=false

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
app.password-reset.hmac-secret=${PASSWORD_RESET_HMAC_SECRET:}

serpapi.key=${SERPAPI_KEY:}
geoapify.api-key=${GEOAPIFY_API_KEY:}
opentripmap.api-key=${OPENTRIPMAP_API_KEY:}
opentripmap.free-plan=${OPENTRIPMAP_FREE_PLAN:true}
landmarks.duplicate-verifier.api-key=${ANTHROPIC_API_KEY:}
landmarks.duplicate-verifier.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
app.commercial-use=${APP_COMMERCIAL_USE:true}
duffel.enabled=${DUFFEL_ENABLED:true}
duffel.access-token=${DUFFEL_ACCESS_TOKEN:}
liteapi.api-key=${LITEAPI_API_KEY:}
liteapi.base-url=${LITEAPI_BASE_URL:https://api.liteapi.travel/v3.0}
liteapi.guest-nationality=${LITEAPI_GUEST_NATIONALITY:LY}
requesty.api-key=${REQUESTY_API_KEY:}
requesty.model=${REQUESTY_MODEL:google/gemma-4-31b-it}
google.places.api-key=${GOOGLE_PLACES_API_KEY:}
app.admin.email=${APP_ADMIN_EMAIL:}
app.partner.accounts=${APP_PARTNER_ACCOUNTS:}
app.bootstrap.partner-reconciliation.enabled=${APP_PARTNER_RECONCILIATION_ENABLED:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB